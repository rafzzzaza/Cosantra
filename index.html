<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosantra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="floating-nav" aria-label="Navigasi utama">
            <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="main-menu">
                <span></span>
                <span></span>
                <span></span>
                <span class="sr-only">Buka menu</span>
            </button>

            <div class="nav-menu" id="main-menu">
                <a href="#home" aria-current="page">Home</a>
                <a href="#tentang">Tentang</a>
                <a href="#fitur">Fakta Sejarah</a>
                <a href="#simpulan">Simpulan</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero page-section" id="home" aria-labelledby="hero-title">
            <div class="hero-lines hero-lines-left" aria-hidden="true"></div>
            <div class="hero-lines hero-lines-right" aria-hidden="true"></div>

            <div class="hero-title">
                <p class="eyebrow">Cosantra</p>
                <h1 id="hero-title">Bahagia<br>Sepanjang<br>Umur</h1>
                <p class="hero-author">Al Habib Ali<br><span>Zeinal Abidin Al-Hamid</span></p>
            </div>

            <div class="hero-person">
                <img src="img/Prof.png" alt="Potret tokoh utama" class="person-image">
            </div>

            <div class="hero-info">
                <p>Dunia ini adalah tempat untuk menghadapi dugaan dan ujian. Perintah-Nya diikuti dan larangan-Nya ditinggalkan; itulah hakikat bahagia sepanjang umur.</p>
            </div>
        </section>

        <section class="content-section page-section" id="tentang" aria-labelledby="tentang-title">
            <h2 id="tentang-title">Tentang</h2>
        </section>
        <section class="content-section page-section" id="fitur" aria-labelledby="fitur-title">
            <h2 id="fitur-title">Fakta Sejarah</h2>
        </section>
        <section class="content-section page-section" id="simpulan" aria-labelledby="simpulan-title">
            <h2 id="simpulan-title">Simpulan</h2>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
